<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Supply Chain AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-bg-animated">
        <div class="auth-blob auth-blob-1"></div>
        <div class="auth-blob auth-blob-2"></div>
        <div class="auth-blob auth-blob-3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card glassmorphism animate-in">
            <div class="auth-brand">
                <div class="auth-logo">
                    <i class="fas fa-link-slash"></i>
                </div>
                <h1 class="auth-title">Supply Chain AI</h1>
                <p class="auth-subtitle">Enterprise Intelligence Platform</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                You have been logged out successfully.
            </div>
            <div th:if="${param.registered}" class="alert alert-success d-flex align-items-center" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                Account created! Please log in.
            </div>
            <div th:if="${param.expired}" class="alert alert-warning d-flex align-items-center" role="alert">
                <i class="fas fa-clock me-2"></i>
                Your session expired. Please log in again.
            </div>

            <form th:action="@{/login}" method="post" autocomplete="on">
                <div class="form-floating mb-3">
                    <input type="text" name="username" id="username" class="form-control auth-input"
                           placeholder="Username" required autocomplete="username">
                    <label for="username"><i class="fas fa-user me-2"></i>Username</label>
                </div>
                <div class="form-floating mb-3 position-relative">
                    <input type="password" name="password" id="password" class="form-control auth-input"
                           placeholder="Password" required autocomplete="current-password">
                    <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                    <button type="button" class="btn-toggle-pass" id="togglePassword">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-auth w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <div class="text-center">
                <p class="mb-0">Don't have an account?
                    <a th:href="@{/register}" class="auth-link fw-semibold">Create Account</a>
                </p>
            </div>

            <div class="auth-demo-creds mt-4">
                <p class="small text-muted text-center mb-2"><i class="fas fa-info-circle me-1"></i>Demo Credentials</p>
                <div class="demo-creds-grid">
                    <div class="demo-cred" onclick="fillCredentials('admin','admin123')">
                        <span class="badge bg-danger me-1">ADMIN</span>
                        admin / admin123
                    </div>
                    <div class="demo-cred" onclick="fillCredentials('demo','demo123')">
                        <span class="badge bg-primary me-1">USER</span>
                        demo / demo123
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const pass = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pass.type === 'password') {
                pass.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pass.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });
        function fillCredentials(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }
    </script>
</body>
</html>
