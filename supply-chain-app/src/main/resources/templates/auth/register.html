<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Supply Chain AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-bg-animated">
        <div class="auth-blob auth-blob-1"></div>
        <div class="auth-blob auth-blob-2"></div>
        <div class="auth-blob auth-blob-3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card glassmorphism animate-in">
            <div class="auth-brand">
                <div class="auth-logo">
                    <i class="fas fa-link-slash"></i>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join the Supply Chain AI Platform</p>
            </div>

            <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post" novalidate>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="text" th:field="*{firstName}" id="firstName"
                                   class="form-control auth-input" placeholder="First Name">
                            <label for="firstName">First Name</label>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="text" th:field="*{lastName}" id="lastName"
                                   class="form-control auth-input" placeholder="Last Name">
                            <label for="lastName">Last Name</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" th:field="*{username}" id="username"
                           class="form-control auth-input"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                           placeholder="Username" required>
                    <label for="username"><i class="fas fa-user me-2"></i>Username</label>
                    <div class="invalid-feedback" th:errors="*{username}">Username error</div>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" th:field="*{email}" id="email"
                           class="form-control auth-input"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="Email" required>
                    <label for="email"><i class="fas fa-envelope me-2"></i>Email Address</label>
                    <div class="invalid-feedback" th:errors="*{email}">Email error</div>
                </div>

                <div class="form-floating mb-3 position-relative">
                    <input type="password" th:field="*{password}" id="password"
                           class="form-control auth-input"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="Password" required>
                    <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                    <button type="button" class="btn-toggle-pass" id="togglePassword">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                    <div class="invalid-feedback" th:errors="*{password}">Password error</div>
                </div>

                <button type="submit" class="btn btn-auth w-100">
                    <i class="fas fa-user-plus me-2"></i>Create Account
                </button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <div class="text-center">
                <p class="mb-0">Already have an account?
                    <a th:href="@{/login}" class="auth-link fw-semibold">Sign In</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const pass = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pass.type === 'password') {
                pass.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pass.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });
    </script>
</body>
</html>
