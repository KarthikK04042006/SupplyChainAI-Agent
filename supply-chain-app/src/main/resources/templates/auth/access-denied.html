<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Supply Chain AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-bg-animated">
        <div class="auth-blob auth-blob-1"></div>
        <div class="auth-blob auth-blob-2"></div>
        <div class="auth-blob auth-blob-3"></div>
    </div>
    <div class="auth-container">
        <div class="auth-card glassmorphism text-center animate-in">
            <div class="mb-4">
                <i class="fas fa-shield-xmark fa-4x text-danger"></i>
            </div>
            <h1 class="display-5 fw-bold text-danger">403</h1>
            <h2 class="fw-bold mb-3">Access Denied</h2>
            <p class="mb-4" style="color:rgba(241,245,249,0.7);">You do not have permission to access this page.
                Please contact your administrator if you believe this is an error.</p>
            <div class="d-flex gap-2 justify-content-center">
                <a th:href="@{/dashboard}" class="btn btn-auth px-4">
                    <i class="fas fa-home me-2"></i>Go to Dashboard
                </a>
                <button onclick="history.back()" class="btn" style="border:1px solid rgba(255,255,255,0.2);color:#f1f5f9;">
                    <i class="fas fa-arrow-left me-2"></i>Go Back
                </button>
            </div>
        </div>
    </div>
</body>
</html>
