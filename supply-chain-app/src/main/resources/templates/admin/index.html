<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout :: head('Admin Panel')}"></th:block>
</head>
<body class="app-body">
<div class="app-wrapper">
    <th:block th:replace="~{layout :: sidebar}"></th:block>
    <div class="main-content" id="mainContent">
        <th:block th:replace="~{layout :: navbar}"></th:block>

        <div class="page-content">
            <div class="page-header" data-aos="fade-down">
                <div>
                    <h1 class="page-title">Admin Panel</h1>
                    <p class="page-subtitle">User management and system administration</p>
                </div>
                <span class="badge bg-danger px-3 py-2">Admin Only</span>
            </div>

            <!-- System Stats -->
            <div class="row g-3 mb-4">
                <div class="col-xl-3 col-md-6" data-aos="zoom-in" data-aos-delay="50">
                    <div class="kpi-card kpi-blue">
                        <div class="kpi-icon"><i class="fas fa-users"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-value" th:text="${#lists.size(users)}">0</div>
                            <div class="kpi-label">Total Users</div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6" data-aos="zoom-in" data-aos-delay="100">
                    <div class="kpi-card kpi-green">
                        <div class="kpi-icon"><i class="fas fa-user-check"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-value" th:text="${users.stream().filter(u -> u.enabled).count()}">0</div>
                            <div class="kpi-label">Active Users</div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6" data-aos="zoom-in" data-aos-delay="150">
                    <div class="kpi-card kpi-purple">
                        <div class="kpi-icon"><i class="fas fa-upload"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-value" th:text="${totalUploads}">0</div>
                            <div class="kpi-label">Total Uploads</div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6" data-aos="zoom-in" data-aos-delay="200">
                    <div class="kpi-card kpi-orange">
                        <div class="kpi-icon"><i class="fas fa-database"></i></div>
                        <div class="kpi-body">
                            <div class="kpi-value" th:text="${totalRecords}">0</div>
                            <div class="kpi-label">Total Records</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="table-card" data-aos="fade-up">
                <div class="table-card-header">
                    <h5 class="chart-title">User Management</h5>
                    <div class="d-flex gap-2">
                        <input type="text" id="userSearch" class="form-control form-control-sm"
                               placeholder="Search users..." style="width:200px;">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="usersTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Email</th>
                                <th>Roles</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td class="text-muted small" th:text="${user.id}">1</td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="user-avatar-sm">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <div>
                                            <div class="fw-semibold" th:text="${user.username}">username</div>
                                            <div class="small text-muted" th:text="${user.firstName + ' ' + user.lastName}">Full Name</div>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${user.email}">email@example.com</td>
                                <td>
                                    <span th:each="role : ${user.roles}"
                                          class="badge me-1"
                                          th:classappend="${role.name == 'ROLE_ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                          th:text="${role.name.replace('ROLE_', '')}">ROLE</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${user.enabled} ? 'Active' : 'Disabled'">Active</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-xs btn-outline-secondary me-1"
                                                th:text="${user.enabled} ? 'Disable' : 'Enable'">Toggle</button>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" class="d-inline"
                                          th:if="${user.username != 'admin'}"
                                          onsubmit="return confirm('Are you sure you want to delete this user?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-xs btn-outline-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var currentPage = 'admin';
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('userSearch').addEventListener('input', function() {
            var q = this.value.toLowerCase();
            document.querySelectorAll('#usersTable tbody tr').forEach(function(row) {
                row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        });
    });
</script>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
