<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | Supply Chain AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-bg-animated">
        <div class="auth-blob auth-blob-1"></div>
        <div class="auth-blob auth-blob-2"></div>
        <div class="auth-blob auth-blob-3"></div>
    </div>
    <div class="auth-container">
        <div class="auth-card glassmorphism text-center animate-in">
            <div class="error-icon mb-4">
                <i class="fas fa-server fa-4x text-danger"></i>
            </div>
            <h1 class="display-4 fw-bold text-danger">500</h1>
            <h2 class="fw-bold mb-3">Internal Server Error</h2>
            <p class="text-muted mb-2">Something went wrong on our end. We've been notified and are working to fix it.</p>
            <div th:if="${error}" class="alert alert-light text-start mt-3 mb-4">
                <small class="text-muted"><code th:text="${error}">Error details</code></small>
            </div>
            <div class="d-flex gap-2 justify-content-center">
                <a th:href="@{/dashboard}" class="btn btn-auth">
                    <i class="fas fa-home me-2"></i>Return to Dashboard
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Go Back
                </button>
            </div>
        </div>
    </div>
</body>
</html>
