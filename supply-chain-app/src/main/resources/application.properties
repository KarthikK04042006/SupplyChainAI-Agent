# Application Info
spring.application.name=Supply Chain AI Agent
server.port=8099

# H2 In-Memory Database (no external DB required)
spring.datasource.url=jdbc:h2:file:./data/supplychain;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.supplychain.ai=DEBUG
logging.level.org.hibernate=WARN

# Custom Properties
app.upload.dir=uploads/
app.ai.model.version=1.0.0-beta

# Session
server.servlet.session.timeout=30m
